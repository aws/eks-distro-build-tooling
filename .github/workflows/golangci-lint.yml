name: golangci-lint
on:
  pull_request:
    paths:
      - 'tools/eksDistroBuildToolingOpsTools/**'
permissions:
  contents: read
  pull-requests: read
jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
          cache-dependency-path: tools/eksDistroBuildToolingOpsTools/go.sum
      - run: go version
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: 'tools/eksDistroBuildToolingOpsTools'
          args: --timeout 10m
